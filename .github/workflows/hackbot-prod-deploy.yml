# Deploy a Hackbot agent or service to prod: each one on its own, and only once
# a reviewer approves it in the GitHub environment for its kind,
# `hackbot-prod-agents` or `hackbot-prod-services`.
#
# Everything is named by its path in the repository (agents/<name>,
# services/<name>), which is also what decides the kind and so the
# environment: the deploy tool maps one to the other, and no list of names is
# kept here.
#
# From the Actions tab (anyone with write access):
#   promote   `plan` compares what stage runs with what prod runs, for one name
#             or for `all` of them. For each that differs, it pins stage's
#             digests and a `promote` job waits for approval in its kind's
#             environment (a reviewer can approve every waiting job of an
#             environment at once), then puts on exactly those, unless stage
#             has moved on in the meantime (superseded). A run cancels older
#             runs still waiting for approval of any of the same names, so
#             there is at most one request per agent or service. A service's
#             promote also marks its Sentry release (<service>@<version>)
#             deployed to production.
#   rollback  step one name back to its previous recorded deployment, in the
#             `hackbot-prod-rollback` environment (not `all`).
#
# Shape changes don't come through here: applying the infra PR's prod
# directory moves prod to the new shape together with the images pinned for
# it. A promote whose image needs a shape prod hasn't applied yet fails with
# "waiting for infra" until that apply.
#
# `plan` runs as the read-only manifest-sync account. Deploys run as the prod
# deploy account, which only a job in one of the three hackbot-prod-*
# environments can get, so no deploy skips an environment's protection.
name: Hackbot prod deploy
run-name: >-
  ${{ format('{0} {1} in prod{2}', inputs.action, inputs.name, inputs.dry_run && ' (dry run)' || '') }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: "What to deploy: all (promote only), agents/<name> or services/<name>"
        required: true
        type: choice
        # all, every agent with a [deploy] table, then the services. Filled in
        # by the hackbot-deploy-names pre-commit hook; don't edit by hand.
        # hackbot-deploy: names
        options:
          - all
          - agents/autowebcompat-diagnosis
          - agents/autowebcompat-intervention
          - agents/autowebcompat-repro
          - agents/bug-fix
          - agents/build-repair
          - agents/dataset-eval
          - agents/frontend-triage
          - agents/gecko-triage
          - agents/perf-regression
          - agents/perf-triage
          - agents/test-plan-generator
          - agents/test-repair
          - agents/test-repair-fix
          - agents/uplift-resolve
          - services/hackbot-api
          - services/hackbot-ui
      action:
        description: "promote: what stage runs; rollback: prod's previous deployment"
        required: true
        type: choice
        options: [promote, rollback]
        default: promote
      dry_run:
        description: "Only say what would happen"
        type: boolean
        default: false

jobs:
  plan:
    if: >-
      inputs.action == 'promote' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: write # cancel older runs still waiting for approval
      contents: read
      id-token: write

    outputs:
      promotions: ${{ steps.plan.outputs.promotions }}
      count: ${{ steps.plan.outputs.count }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.HACKBOT_MANIFEST_SYNC_SA }}

      # One entry per name whose stage and prod differ; an empty list when
      # there is nothing to promote.
      - name: What stage runs that prod doesn't
        id: plan
        env:
          NAME: ${{ inputs.name }}
        run: |
          uv run --frozen --package hackbot-deploy python -m hackbot_deploy promotions "$NAME" \
            --from stage --to prod --output "$RUNNER_TEMP/promotions.json"
          echo "promotions=$(jq -c . "$RUNNER_TEMP/promotions.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length "$RUNNER_TEMP/promotions.json")" >> "$GITHUB_OUTPUT"
          {
            if [ "$(jq length "$RUNNER_TEMP/promotions.json")" -eq 0 ]; then
              echo "### $NAME: nothing to promote"
              echo "Prod already runs what stage runs."
            fi
            jq -r --arg repo "$GITHUB_REPOSITORY" '.[] |
              "### Promote \(.name) to prod (approval in \(.environment))",
              "- commit: \(.revision // "unknown")",
              "- built: \(.created // "unknown"), deployed to stage by \(.deployed_by // "unknown")",
              (if .replaces then
                "- replaces: \(.replaces.revision // "unknown") (changes: https://github.com/\($repo)/compare/\(.replaces.revision)...\(.revision))"
               else "- first deploy to prod" end),
              "",
              (.images | to_entries[] | "- `\(.key)`: `\(.value)`"),
              ""
            ' "$RUNNER_TEMP/promotions.json"
          } >> "$GITHUB_STEP_SUMMARY"

      # They haven't started deploying (that only begins after approval), so
      # cancelling can't interrupt one. Matched by the promote jobs' names.
      - name: Cancel older requests for the same names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r '.[].name' "$RUNNER_TEMP/promotions.json" > "$RUNNER_TEMP/names.txt"
          [ -s "$RUNNER_TEMP/names.txt" ] || exit 0
          gh run list --repo "$GITHUB_REPOSITORY" --workflow hackbot-prod-deploy.yml \
              --status waiting --json databaseId --jq '.[].databaseId' |
            while read -r run; do
              [ "$run" -lt "$GITHUB_RUN_ID" ] || continue
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                  --jq '.jobs[] | select(.status == "waiting") | .name' |
                sed -n 's/^promote //p' > "$RUNNER_TEMP/waiting.txt"
              if grep -qxFf "$RUNNER_TEMP/names.txt" "$RUNNER_TEMP/waiting.txt"; then
                echo "Cancelling run $run: an older request for some of the same names"
                gh run cancel "$run" --repo "$GITHUB_REPOSITORY"
              fi
            done

  promote:
    # The plan job of a newer run finds and cancels this one by this name.
    name: promote ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.count != '0' && !inputs.dry_run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.promotions) }}
    # Chosen by the deploy tool from the kind: hackbot-prod-agents or
    # hackbot-prod-services.
    environment: ${{ matrix.environment }}

    # One deploy of a given agent or service at a time; different ones in
    # parallel.
    concurrency:
      group: hackbot-prod-deploy-${{ matrix.name }}
      cancel-in-progress: false

    permissions:
      actions: read # who approved, for deployed_by
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.HACKBOT_PROD_DEPLOY_SA }}

      - name: Deploy what was approved
        env:
          NAME: ${{ matrix.name }}
          ENVIRONMENT: ${{ matrix.environment }}
          PROMOTION: ${{ toJSON(matrix) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$PROMOTION" > "$RUNNER_TEMP/promotion.json"
          # A run can wait in both environments; the approver is whoever
          # approved this job's.
          approver=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" | jq -r --arg env "$ENVIRONMENT" \
            '[.[] | select(.state == "approved" and any(.environments[]; .name == $env))] | last | .user.login // empty')
          export HACKBOT_DEPLOY_ACTOR="github:${approver:-$GITHUB_ACTOR}"

          set +e
          uv run --frozen --package hackbot-deploy python -m hackbot_deploy promote "$NAME" \
            --from stage --to prod --expect "$RUNNER_TEMP/promotion.json" 2>&1 | tee "$RUNNER_TEMP/out.txt"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "### promote $NAME in prod (approved by ${approver:-unknown})"
            echo '```'
            cat "$RUNNER_TEMP/out.txt"
            echo '```'
            if grep -q ": superseded" "$RUNNER_TEMP/out.txt"; then
              echo "Stage has moved on since this was planned; promote again to put on what it runs now."
            fi
            if [ "$status" -eq 3 ]; then
              echo "Prod hasn't applied the shape this image was built for. Apply the infra PR's prod directory first; that apply puts on the images pinned for the new shape."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The stage build made the release (<service>@<version>, with its
      # commits); a promote puts that same release in production.
      - name: Mark the Sentry release deployed to production
        if: startsWith(matrix.name, 'services/')
        env:
          NAME: ${{ matrix.name }}
          PROMOTION: ${{ toJSON(matrix) }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mozilla
        run: |
          if ! grep -q ": deployed" "$RUNNER_TEMP/out.txt"; then
            echo "Nothing was deployed; no Sentry deploy to mark."
            exit 0
          fi
          version=$(jq -r '.version // empty' <<< "$PROMOTION")
          if [ -z "$version" ]; then
            echo "::warning::Stage's record has no version (deployed before versions were recorded); the production deploy isn't marked in Sentry."
            exit 0
          fi
          service="${NAME#services/}"
          SENTRY_PROJECT="$service" npx --yes @sentry/cli@2 deploys new --release "$service@$version" -e production

  # One name at a time: rolling everything back at once is rarely meant.
  rollback:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' &&
      inputs.name != 'all' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: hackbot-prod-rollback

    concurrency:
      group: hackbot-prod-deploy-${{ inputs.name }}
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.HACKBOT_PROD_DEPLOY_SA }}

      - name: Roll back
        env:
          NAME: ${{ inputs.name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(rollback "$NAME" --env prod)
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi

          set +e
          uv run --frozen --package hackbot-deploy python -m hackbot_deploy "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/out.txt"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "### rollback $NAME in prod"
            echo '```'
            cat "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
