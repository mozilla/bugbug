[project]
name = "hackbot-deploy"
version = "0.1.0"
description = "Hackbot agent deploy tooling: the [deploy] schema, the agents.json generator and the deploy script"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.0.0",
    "google-cloud-build>=3.0.0",
    "google-cloud-run>=0.10.0",
    "google-cloud-storage>=2.16.0",
    "pydantic>=2.0",
    "requests>=2.32.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
hackbot-deploy = "hackbot_deploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
