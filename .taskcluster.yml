version: 1
reporting: checks-v1
policy:
  pullRequests: public

tasks:
  - created: {$fromNow: ""}
    deadline: {$fromNow: "1 hour"}
    provisionerId: proj-bugbug
    workerType: batch
    scopes:
      - secrets:get:project/bugbug/integration
    payload:
      maxRunTime: 300
      image: curlimages/curl:latest
      features:
        taskclusterProxy: true
      command:
        - /bin/sh
        - -c
        - |
          echo "SAFE POC: checking effective scopes only"
          echo "This task does NOT read the secret value"
          curl -sS "$TASKCLUSTER_PROXY_URL/api/auth/v1/scopes/current" > scopes.json
          echo "Looking for the sensitive scope:"
          grep -F "secrets:get:project/bugbug/integration" scopes.json
          echo "Done"
    metadata:
      name: safe external PR scope proof
      description: Safe proof that an external PR task receives the secret-read scope without reading the secret.
      owner: LucasM0ntes@users.noreply.github.com
      source: ${event.pull_request.head.repo.html_url}/raw/${event.pull_request.head.sha}/.taskcluster.yml