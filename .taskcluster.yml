version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
tasks:
  $let:
    user: ${event.sender.login}

    head_branch:
      $if: 'tasks_for[:19] == "github-pull-request"'
      then: ${event.pull_request.head.ref}
      else:
        $if: 'tasks_for == "github-push"'
        then: ${event.ref}
        else: ${event.release.target_commitish}

    head_rev:
      $if: 'tasks_for[:19] == "github-pull-request"'
      then: ${event.pull_request.head.sha}
      else:
        $if: 'tasks_for == "github-push"'
        then: ${event.after}
        else: ${event.release.tag_name}

    repository:
      $if: 'tasks_for[:19] == "github-pull-request"'
      then: ${event.pull_request.head.repo.html_url}
      else: ${event.repository.html_url}

    pr_description:
      $if: 'tasks_for[:19] == "github-pull-request"'
      then: ${event.pull_request.body}

    taskboot_image: "mozilla/taskboot:0.4.2"
  in:
    $let:
      default_task_definition:
        created: { $fromNow: "" }
        deadline: { $fromNow: "1 hour" }
        provisionerId: proj-bugbug
        workerType: batch
        payload:
          maxRunTime: 3600
          image: astral/uv:python3.12-trixie
        metadata:
          owner: mcastelluccio@mozilla.com
          source: ${repository}/raw/${head_rev}/.taskcluster.yml
    in:
      $if: '(tasks_for == "github-push" && head_branch[:18] != "refs/heads/deploy/") || (tasks_for[:19] == "github-pull-request" && event["action"] in ["opened", "reopened", "synchronize"])'
      then:
        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("lint_task") }
              payload:
                command:
                  - "/bin/bash"
                  - "-cx"
                  - "git clone --quiet ${repository} &&
                    cd bugbug &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    uv sync --locked --package bugbug --only-group test &&
                    uv run pre-commit run -a --show-diff-on-failure"
              metadata:
                name: bugbug lint
                description: bugbug lint

        - $if: 'tasks_for == "github-push"'
          then:
            $mergeDeep:
              - { $eval: default_task_definition }
              - taskId: { $eval: as_slugid("version_check_task") }
                payload:
                  command:
                    - "/bin/bash"
                    - "-cx"
                    - "git clone --quiet ${repository} &&
                      cd bugbug &&
                      git -c advice.detachedHead=false checkout ${head_rev} &&
                      python infra/version_check.py"
                metadata:
                  name: bugbug tag version check
                  description: bugbug tag version check

        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("tests_task") }
              workerType: compute-smaller
              payload:
                env:
                  CODECOV_TOKEN: 66162f89-a4d9-420c-84bd-d10f12a428d9
                command:
                  - "/bin/bash"
                  - "-cx"
                  - "apt-get -qq update &&
                    apt-get -qq install -y libhdf5-dev zstd &&
                    git clone --quiet ${repository} &&
                    curl -L https://github.com/mozilla/rust-code-analysis/releases/download/v0.0.23/rust-code-analysis-linux-web-x86_64.tar.gz | tar -C /usr/bin -xzv &&
                    cd bugbug &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    cp infra/hgrc /etc/mercurial/hgrc.d/bugbug.rc &&
                    uv sync --locked --package bugbug --group test --extra nlp --group spawn-pipeline &&
                    hg clone -r 50a59e00c4a76fcfae660e3feb9b79e0cd549b15 https://hg.mozilla.org/hgcustom/version-control-tools /version-control-tools/ &&
                    uv run pytest --cov=./ tests/test_*.py &&
                    bash <(curl -s https://codecov.io/bash)"
              metadata:
                name: bugbug tests
                description: bugbug tests

        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("http_tests_task") }
              workerType: compute-smaller
              payload:
                env:
                  CODECOV_TOKEN: 66162f89-a4d9-420c-84bd-d10f12a428d9
                command:
                  - "/bin/bash"
                  - "-cx"
                  - "apt-get -qq update &&
                    apt-get -qq install -y zstd &&
                    git clone --quiet ${repository} &&
                    curl -L https://github.com/mozilla/rust-code-analysis/releases/download/v0.0.23/rust-code-analysis-linux-web-x86_64.tar.gz | tar -C /usr/bin -xzv &&
                    cd bugbug &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    cp infra/hgrc /etc/mercurial/hgrc.d/bugbug.rc &&
                    uv sync --locked --package bugbug --package bugbug-http-service --group test &&
                    hg clone -r 50a59e00c4a76fcfae660e3feb9b79e0cd549b15 https://hg.mozilla.org/hgcustom/version-control-tools /version-control-tools/ &&
                    uv run pytest --cov=http_service http_service/tests/ -vvv &&
                    bash <(curl -s https://codecov.io/bash)"
              metadata:
                name: bugbug http service tests
                description: bugbug http service tests

        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("libs_tests_task") }
              workerType: compute-smaller
              payload:
                env:
                  CODECOV_TOKEN: 66162f89-a4d9-420c-84bd-d10f12a428d9
                command:
                  - "/bin/bash"
                  - "-cx"
                  - "git clone --quiet ${repository} &&
                    cd bugbug &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    export COVERAGE_FILE=$(pwd)/.coverage &&
                    cd libs/agent-tools &&
                    uv run --locked --with pytest==9.1.0 --with pytest-cov==7.1.0 --with pytest-asyncio==1.4.0 --extra bugzilla --extra firefox --extra claude-sdk pytest --cov=agent_tools --cov-append tests/ &&
                    cd ../hackbot-runtime &&
                    uv run --locked --with pytest==9.1.0 --with pytest-cov==7.1.0 --with pytest-asyncio==1.4.0 --extra claude-sdk --extra phabricator pytest --cov=hackbot_runtime --cov-append tests/ &&
                    cd ../phabricator-client &&
                    uv run --locked --with pytest==9.1.0 --with pytest-cov==7.1.0 --with pytest-asyncio==1.4.0 pytest --cov=phabricator_client --cov-append tests/ &&
                    cd ../phabricator-proxy &&
                    uv run --locked --with pytest==9.1.0 --with pytest-cov==7.1.0 --with pytest-asyncio==1.4.0 pytest --cov=phabricator_proxy --cov-append tests/ &&
                    cd ../lando-client &&
                    uv run --locked --with pytest==9.1.0 --with pytest-cov==7.1.0 --with pytest-asyncio==1.4.0 pytest --cov=lando_client --cov-append tests/ &&
                    cd ../.. &&
                    bash <(curl -s https://codecov.io/bash)"
              metadata:
                name: bugbug libs tests
                description: bugbug libs tests

        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("packaging_test_task") }
              payload:
                env:
                  CODECOV_TOKEN: 66162f89-a4d9-420c-84bd-d10f12a428d9
                command:
                  - "/bin/bash"
                  - "-cx"
                  - "apt-get -qq update &&
                    apt-get -qq install -y libhdf5-dev &&
                    git clone --quiet ${repository} &&
                    cd bugbug &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    uv build &&
                    uv venv /tmp/test-venv &&
                    uv pip install --python /tmp/test-venv/bin/python dist/bugbug-$(cat VERSION).tar.gz &&
                    uv pip install --python /tmp/test-venv/bin/python dist/bugbug-$(cat VERSION).tar.gz[nlp] &&
                    bash <(curl -s https://codecov.io/bash)"
              metadata:
                name: bugbug packaging test
                description: bugbug packaging test

        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("docker_build") }
              deadline: { $fromNow: "3 hours" }
              workerType: ci
              payload:
                capabilities:
                  privileged: true
                maxRunTime: 10800
                image: "${taskboot_image}"
                env:
                  REGISTRY: registry.hub.docker.com
                  VERSION:
                    $if: 'head_branch[:10] == "refs/tags/"'
                    then: { $eval: "head_branch[10:]" }
                    else: "latest"
                command:
                  - "/bin/sh"
                  - "-cxe"
                  - "git clone --quiet ${repository} /code &&
                    cd /code &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    taskboot --target /code build-compose --write /images --build-arg CHECK_MODELS=0 --tag $VERSION --tag latest"
                artifacts:
                  public/bugbug:
                    expires: { $fromNow: "2 weeks" }
                    path: /images
                    type: directory
              scopes:
                - docker-worker:capability:privileged
              metadata:
                name: bugbug docker build
                description: bugbug docker build

        - $if: 'tasks_for[:19] == "github-pull-request" && "Train on Taskcluster: " in pr_description'
          then:
            $mergeDeep:
              - { $eval: default_task_definition }
              - dependencies:
                  - { $eval: as_slugid("docker_build") }
                taskId: { $eval: as_slugid("train_on_taskcluster") }
                deadline: { $fromNow: "1 day" }
                workerType: compute-large
                payload:
                  maxRunTime:
                    $switch:
                      '"Train on Taskcluster: regression" in pr_description': 2700
                      $default: 10800
                  image:
                    type: task-image
                    path: public/bugbug/bugbug-base.tar.zst
                    taskId: { $eval: as_slugid("docker_build") }
                  env:
                    PR_DESCRIPTION: "${pr_description}"
                  command:
                    - "/bin/sh"
                    - "-cx"
                    - "uv run python -m scripts.trainer $(uv run python -m scripts.trainer_extract_args)"
                metadata:
                  name: bugbug train on TC
                  description: Train a BugBug model on Taskcluster

        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("frontend_build") }
              payload:
                image: node:lts
                command:
                  - "/bin/sh"
                  - "-cxe"
                  - "git clone --quiet ${repository} /bugbug &&
                    cd /bugbug &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    cd ui/changes &&
                    npm install --no-progress &&
                    npm run release"
                artifacts:
                  public/frontend:
                    expires: { $fromNow: "2 weeks" }
                    path: /bugbug/ui/changes/dist
                    type: directory
              metadata:
                name: bugbug ui build
                description: bugbug ui build

        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("hackbot_ui_tests_task") }
              payload:
                image: node:lts
                command:
                  - "/bin/sh"
                  - "-cxe"
                  - "git clone --quiet ${repository} /bugbug &&
                    cd /bugbug &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    cd services/hackbot-ui &&
                    npm ci --no-progress &&
                    npm test"
              metadata:
                name: bugbug hackbot-ui tests
                description: bugbug hackbot-ui tests

        # Agent images use BuildKit features and a non-final target, which taskboot's
        # build commands don't support, so call podman (what taskboot uses) directly.
        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("bug_fix_image_build") }
              workerType: ci
              payload:
                capabilities:
                  privileged: true
                image: "${taskboot_image}"
                command:
                  - "/bin/sh"
                  - "-cxe"
                  - "git clone --quiet ${repository} /code &&
                    cd /code &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    podman build --target agent -f agents/bug-fix/Dockerfile -t mozilla/bugbug-hackbot-agent-bug-fix:latest . &&
                    mkdir /images &&
                    podman save --format docker-archive mozilla/bugbug-hackbot-agent-bug-fix:latest | zstd -q -o /images/bugbug-hackbot-agent-bug-fix.tar.zst"
                artifacts:
                  public/bug-fix-agent:
                    expires: { $fromNow: "2 weeks" }
                    path: /images
                    type: directory
              scopes:
                - docker-worker:capability:privileged
              metadata:
                name: bugbug bug-fix agent image build
                description: bugbug bug-fix agent image build

        # Runs inside the image, where the entrypoint has started the display and
        # audio services. The tests download Firefox, minidump-stackwalk and Python
        # packages, so failures are retried once to ride out network hiccups.
        # TASKCLUSTER_ROOT_URL is unset as it is where the agent runs: mach would
        # otherwise look Firefox's toolchains up on this cluster.
        - $mergeDeep:
            - { $eval: default_task_definition }
            - taskId: { $eval: as_slugid("bug_fix_image_tests") }
              dependencies:
                - { $eval: as_slugid("bug_fix_image_build") }
              payload:
                image:
                  type: task-image
                  path: public/bug-fix-agent/bugbug-hackbot-agent-bug-fix.tar.zst
                  taskId: { $eval: as_slugid("bug_fix_image_build") }
                command:
                  - "/bin/bash"
                  - "-cx"
                  - "git clone --quiet ${repository} /tmp/bugbug &&
                    cd /tmp/bugbug &&
                    git -c advice.detachedHead=false checkout ${head_rev} &&
                    /usr/local/bin/python3 -m pip install --quiet --disable-pip-version-check --target /tmp/pydeps pytest==9.1.0 &&
                    cd agents/bug-fix &&
                    unset TASKCLUSTER_ROOT_URL &&
                    export PYTHONPATH=/tmp/pydeps BUG_FIX_IMAGE_INSIDE=1 &&
                    (python -m pytest -v -rs tests/test_image.py ||
                    python -m pytest -v -rs --last-failed tests/test_image.py)"
              metadata:
                name: bugbug bug-fix agent image tests
                description: bugbug bug-fix agent image tests

        # Bootstraps a Firefox checkout, makes an artifact build and runs tests in
        # it. This mostly breaks because of changes in Firefox, so it runs after
        # merges rather than on every pull request.
        # TEMPORARY: also on pull requests, to verify it on this PR. Drop the
        # pull request condition before merging.
        - $if: '(tasks_for == "github-push" && head_branch == "refs/heads/master") || tasks_for[:19] == "github-pull-request"'
          then:
            $mergeDeep:
              - { $eval: default_task_definition }
              - taskId: { $eval: as_slugid("bug_fix_image_slow_tests") }
                dependencies:
                  - { $eval: as_slugid("bug_fix_image_build") }
                workerType: compute-large
                payload:
                  env:
                    BUG_FIX_IMAGE_SLOW: "1"
                  image:
                    type: task-image
                    path: public/bug-fix-agent/bugbug-hackbot-agent-bug-fix.tar.zst
                    taskId: { $eval: as_slugid("bug_fix_image_build") }
                  command:
                    - "/bin/bash"
                    - "-cx"
                    - "git clone --quiet ${repository} /tmp/bugbug &&
                      cd /tmp/bugbug &&
                      git -c advice.detachedHead=false checkout ${head_rev} &&
                      /usr/local/bin/python3 -m pip install --quiet --disable-pip-version-check --target /tmp/pydeps pytest==9.1.0 &&
                      cd agents/bug-fix &&
                      unset TASKCLUSTER_ROOT_URL &&
                      export PYTHONPATH=/tmp/pydeps BUG_FIX_IMAGE_INSIDE=1 &&
                      (python -m pytest -s -v -rs tests/test_image.py -k artifact_build ||
                      python -m pytest -s -v -rs --last-failed tests/test_image.py -k artifact_build)"
                metadata:
                  name: bugbug bug-fix agent image slow tests
                  description: bugbug bug-fix agent image slow tests

        # Like the slow tests, but a full build with the agent's own mozconfig, as
        # the agent makes. It takes hours, so a failure is not retried.
        # TEMPORARY: also on pull requests, to verify it on this PR. Drop the
        # pull request condition before merging.
        - $if: '(tasks_for == "github-push" && head_branch == "refs/heads/master") || tasks_for[:19] == "github-pull-request"'
          then:
            $mergeDeep:
              - { $eval: default_task_definition }
              - taskId: { $eval: as_slugid("bug_fix_image_full_build_tests") }
                dependencies:
                  - { $eval: as_slugid("bug_fix_image_build") }
                deadline: { $fromNow: "8 hours" }
                workerType: compute-super-large
                payload:
                  maxRunTime: 21600
                  env:
                    BUG_FIX_IMAGE_FULL_BUILD: "1"
                  image:
                    type: task-image
                    path: public/bug-fix-agent/bugbug-hackbot-agent-bug-fix.tar.zst
                    taskId: { $eval: as_slugid("bug_fix_image_build") }
                  command:
                    - "/bin/bash"
                    - "-cx"
                    - "git clone --quiet ${repository} /tmp/bugbug &&
                      cd /tmp/bugbug &&
                      git -c advice.detachedHead=false checkout ${head_rev} &&
                      /usr/local/bin/python3 -m pip install --quiet --disable-pip-version-check --target /tmp/pydeps pytest==9.1.0 &&
                      cd agents/bug-fix &&
                      unset TASKCLUSTER_ROOT_URL &&
                      export PYTHONPATH=/tmp/pydeps BUG_FIX_IMAGE_INSIDE=1 &&
                      python -m pytest -s -v -rs tests/test_image.py -k full_build"
                metadata:
                  name: bugbug bug-fix agent image full build tests
                  description: bugbug bug-fix agent image full build tests

        - $if: 'tasks_for == "github-push" && head_branch[:10] == "refs/tags/"'
          then:
            $mergeDeep:
              - { $eval: default_task_definition }
              - dependencies:
                  - { $eval: as_slugid("lint_task") }
                  - { $eval: as_slugid("tests_task") }
                  - { $eval: as_slugid("http_tests_task") }
                  - { $eval: as_slugid("libs_tests_task") }
                  - { $eval: as_slugid("frontend_build") }
                  - { $eval: as_slugid("hackbot_ui_tests_task") }
                  - { $eval: as_slugid("packaging_test_task") }
                  - { $eval: as_slugid("version_check_task") }
                  - { $eval: as_slugid("integration_test") }
                scopes:
                  - secrets:get:project/bugbug/deploy
                payload:
                  features:
                    taskclusterProxy: true
                  image: "${taskboot_image}"
                  command:
                    - taskboot
                    - deploy-pypi
                  env:
                    TASKCLUSTER_SECRET: project/bugbug/deploy
                    GIT_REPOSITORY: "${repository}"
                    GIT_REVISION: "${head_rev}"
                metadata:
                  name: bugbug PyPI release
                  description: bugbug PyPI release

        - $if: 'tasks_for == "github-push" && head_branch[:10] == "refs/tags/"'
          then:
            $mergeDeep:
              - { $eval: default_task_definition }
              - dependencies:
                  - { $eval: as_slugid("docker_build") }
                  - { $eval: as_slugid("lint_task") }
                  - { $eval: as_slugid("version_check_task") }
                  - { $eval: as_slugid("tests_task") }
                  - { $eval: as_slugid("http_tests_task") }
                  - { $eval: as_slugid("libs_tests_task") }
                  - { $eval: as_slugid("frontend_build") }
                  - { $eval: as_slugid("hackbot_ui_tests_task") }
                  - { $eval: as_slugid("packaging_test_task") }
                scopes:
                  - secrets:get:project/bugbug/deploy
                taskId: { $eval: as_slugid("docker_push") }
                deadline: { $fromNow: "4 hours" }
                payload:
                  features:
                    taskclusterProxy: true
                  image: "${taskboot_image}"
                  env:
                    TASKCLUSTER_SECRET: project/bugbug/deploy
                  command:
                    - taskboot
                    - push-artifact
                    - --exclude-filter
                    - "*http-service*"
                metadata:
                  name: bugbug docker push
                  description: bugbug docker push

        # It's the same task integration_test as in data-pipeline.yml
        - $if: 'tasks_for == "github-push" && head_branch[:10] == "refs/tags/"'
          then:
            $mergeDeep:
              - { $eval: default_task_definition }
              - taskId: { $eval: as_slugid("integration_test") }
                dependencies:
                  - { $eval: as_slugid("docker_push") }
                workerType: compute-large
                scopes:
                  - secrets:get:project/bugbug/integration
                  - "docker-worker:cache:bugbug-mercurial-repository"
                  - "generic-worker:cache:bugbug-mercurial-repository"
                payload:
                  features:
                    taskclusterProxy: true
                  maxRunTime: 10800
                  image: mozilla/bugbug-commit-retrieval:${head_branch[10:]}
                  env:
                    TC_SECRET_ID: project/bugbug/integration
                    CACHE_DIR: "/cache"
                  command:
                    - "/bin/bash"
                    - "-cx"
                    - "apt-get -qq update &&
                      apt-get -qq install -y redis-server &&
                      git clone --quiet ${repository} &&
                      cd bugbug &&
                      git -c advice.detachedHead=false checkout ${head_rev} &&
                      python -c 'import os; print(os.environ.keys())' &&
                      bash ./scripts/integration_test.sh"
                  cache:
                    bugbug-mercurial-repository: /cache
                metadata:
                  name: bugbug integration test
                  description: bugbug integration test
                  owner: ${user}@users.noreply.github.com

        - $if: 'tasks_for == "github-push" && head_branch[:10] == "refs/tags/"'
          then:
            $mergeDeep:
              - { $eval: default_task_definition }
              - taskId: { $eval: as_slugid("update_hook_data_pipeline") }
                dependencies:
                  - { $eval: as_slugid("integration_test") }
                scopes:
                  - hooks:modify-hook:project-bugbug/bugbug
                  - assume:hook-id:project-bugbug/bugbug
                  - queue:route:project.bugbug.deploy_ending.*
                deadline: { $fromNow: "5 hours" }
                payload:
                  features:
                    taskclusterProxy: true
                  image: "${taskboot_image}"
                  command:
                    - "/bin/sh"
                    - "-cxe"
                    - "git clone --quiet ${repository} &&
                      cd bugbug &&
                      git -c advice.detachedHead=false checkout ${head_rev} &&
                      python infra/set_hook_version.py ${head_branch[10:]} infra/taskcluster-hook-data-pipeline.json &&
                      taskboot --target . build-hook infra/taskcluster-hook-data-pipeline.json project-bugbug bugbug"
                routes:
                  - project.bugbug.deploy_ending
                metadata:
                  name: bugbug update data hook
                  description: bugbug update data hook
