# test-plan-generator needs no platform prep: no [source] checkout and no
# [firefox] build. It downloads a fresh Firefox Nightly at startup and drives it
# through the Firefox DevTools MCP server.

# Infrastructure this agent runs on, applied by Terraform in
# mozilla/webservices-infra (see tools/hackbot-deploy). Changing anything here
# changes the agent's shape and goes through an infra PR; the image ships on
# its own.
[deploy]
runtime = "cloud_run_job"
cpu = "6"
memory = "24Gi"
timeout_seconds = 7200
