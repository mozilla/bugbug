[project]
name = "hackbot-agent-example-codex"
version = "0.1.0"
description = "Cloud Run Job image for a minimal reference agent that runs on Codex"
requires-python = ">=3.14"
dependencies = [
    "hackbot-runtime[codex-sdk]",
    "agent-tools[bugzilla,codex-sdk]",
    "bugsy",
]

[tool.uv.sources]
hackbot-runtime = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents"]
