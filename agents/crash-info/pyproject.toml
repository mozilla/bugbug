[project]
name = "hackbot-agent-crash-info"
version = "0.1.0"
description = "Cloud Run Job image that runs the crash-info agent for hackbot-api: finds the information missing from a crash bug, recovers what the evidence establishes and infers the rest"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hackbot-runtime[claude-sdk]",
    "claude-agent-sdk>=0.2.165",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.uv.sources]
hackbot-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Same rule families as bugbug's root pyproject, minus the copyright check.
select = ["E4", "E7", "E9", "F", "I", "T10", "G", "B", "SIM", "ASYNC"]
# SIM905: whitespace-split word lists read better than long list literals.
ignore = ["B905", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# The agent runs one investigation at a time; short blocking reads are harmless.
"hackbot_agents/**" = ["ASYNC"]
