services:
  # Holds the Bugzilla and Phabricator keys, serving their read-only MCP tools
  # and the Conduit proxy the agent fetches each source's raw diff through, so
  # the agent binds no credential itself.
  uplift-resolve-broker:
    build:
      context: ../..
      dockerfile: agents/uplift-resolve/Dockerfile
      target: broker
    environment:
      BUGZILLA_API_URL: ${BUGZILLA_API_URL:-https://bugzilla.mozilla.org/rest}
      BUGZILLA_API_KEY: ${BUGZILLA_API_KEY:-}
      PHABRICATOR_URL: ${PHABRICATOR_URL:-https://phabricator.services.mozilla.com}
      PHABRICATOR_API_KEY: ${PHABRICATOR_API_KEY:-}
    expose:
      - "8765"

  uplift-resolve-agent:
    build:
      context: ../..
      dockerfile: agents/uplift-resolve/Dockerfile
      target: agent
    environment:
      - RUN_ID
      - TARGET_BRANCH=${TARGET_BRANCH:-}
      - TARGET_COMMIT=${TARGET_COMMIT:-}
      - SOURCES=${SOURCES:-}
      - BUG_ID=${BUG_ID:-}
      - BROKER_URL=http://uplift-resolve-broker:8765
      - SOURCE_REPO=/workspace/firefox
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?error}
      # No uploader locally: summary/logs/artifacts are written under
      # /artifacts/<run_id>, bind-mounted to the host's ~/hackbot/artifacts.
      - ARTIFACTS_DIR=/artifacts
    volumes:
      - workspace:/workspace
      - ${HOME}/hackbot/artifacts:/artifacts
    depends_on:
      uplift-resolve-broker:
        condition: service_started

volumes:
  workspace:
