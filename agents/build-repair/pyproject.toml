[project]
name = "hackbot-agent-build-repair"
dynamic = ["version"]
description = "Cloud Run Job image that runs the build-repair agent for hackbot-api"
requires-python = ">=3.14"
dependencies = [
    "hackbot-runtime[claude-sdk,phabricator]",
    "agent-tools[bugzilla,firefox]",
    "bugzilla-client",
    "claude-agent-sdk>=0.2.165",
    "mcp>=1.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
    "requests"
]

[project.optional-dependencies]
eval = [
    "weave",
    "wandb",
    "tenacity",
]

[tool.uv.sources]
hackbot-runtime = { workspace = true }
agent-tools = { workspace = true }
bugzilla-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
