[project]
name = "hackbot-agent-perf-regression"
dynamic = ["version"]
description = "Investigate performance regressions and validate candidate fixes on try"
requires-python = ">=3.14"
dependencies = [
    "agent-tools[bugzilla,vcs]",
    "hackbot-runtime[claude-sdk]",
    "lando-client",
    "httpx>=0.26.0",
    "scipy>=1.14.0",
]

[tool.uv.sources]
agent-tools = { workspace = true }
hackbot-runtime = { workspace = true }
lando-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
