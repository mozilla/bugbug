[project]
name = "hackbot-agent-dataset-eval"
version = "0.1.0"
description = "Runs an agent over an eval dataset, grades it and logs the results to Weave"
requires-python = ">=3.12"
dependencies = [
    "hackbot-runtime[claude-sdk]",
    "agent-tools[firefox]",
    "claude-agent-sdk>=0.2.165",
    "pydantic-settings",
    "anthropic",
    "openai-codex==0.163.0",
]

[project.optional-dependencies]
a11y = ["pygobject>=3.52"]

[tool.uv.sources]
hackbot-runtime = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
