[project]
name = "hackbot-agent-bug-fix"
dynamic = ["version"]
description = "Cloud Run Job image that runs the bug-fix agent for hackbot-api"
requires-python = ">=3.14"
dependencies = [
    "hackbot-runtime[claude-sdk,phabricator]",
    "agent-tools[bugzilla,firefox]",
    "phabricator-client",
    "phabricator-proxy",
    "bugzilla-client",
    "claude-agent-sdk>=0.1.30",
    "mcp>=1.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
# For the Atspi binding, to inspect accessibility trees. PyGObject builds from
# source, against headers only the image's builder has.
a11y = ["pygobject>=3.52"]

[tool.uv.sources]
hackbot-runtime = { workspace = true }
agent-tools = { workspace = true }
bugzilla-client = { workspace = true }
phabricator-client = { workspace = true }
phabricator-proxy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
