[project]
name = "hackbot-agent-bug-fix"
version = "0.1.0"
description = "Cloud Run Job image that runs the bug-fix agent for hackbot-api"
requires-python = ">=3.12"
dependencies = [
    "hackbot-runtime[claude-sdk]",
    # firefox + bugzilla MCP tool servers (grizzly/prefpicker/bugsy come via these extras)
    "agent-tools[bugzilla,firefox]",
    "bugsy",
    "claude-agent-sdk>=0.1.30",
    "mcp>=1.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
]

[tool.uv.sources]
hackbot-runtime = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable packages don't match the project name, so declare them
# explicitly. Without this a wheel build (e.g. `uv sync --no-editable`) would
# bundle nothing and `python -m agent` would fail in a source-free image.
# `agent` carries the prompt/rules .md assets it reads via
# `Path(__file__).parent`; hatchling bundles all files under these dirs,
# including the .md files.
[tool.hatch.build.targets.wheel]
packages = ["agent", "broker"]
