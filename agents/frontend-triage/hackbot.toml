[source]
repo_url = "https://github.com/mozilla-firefox/firefox.git"
checkout_path = "/workspace/firefox"

# No [firefox] table: this agent does read-only triage and planning. It never
# builds Firefox or runs testcases, so the build toolchain is not prepared.

# Infrastructure this agent runs on, applied by Terraform in
# mozilla/webservices-infra (see tools/hackbot-deploy). Changing anything here
# changes the agent's shape and goes through an infra PR; the image ships on
# its own.
[deploy]
runtime = "cloud_run_job"
cpu = "6"
memory = "24Gi"
timeout_seconds = 7200

[deploy.broker]
cpu = "1"
memory = "512Mi"

[deploy.broker.secret_env]
BUGZILLA_API_KEY = "bugzilla-api-key"
PHABRICATOR_API_KEY = "phabricator-api-key"
