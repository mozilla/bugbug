[source]
repo_url = "https://github.com/mozilla-firefox/firefox.git"
checkout_path = "/workspace/firefox"
# The agent prepares the tree at the culprit the test-repair run blamed, so the
# patch it leaves is a change to that commit.

[firefox]
enabled = true
objdir = "objdir-test-repair"

# Infrastructure this agent runs on, applied by Terraform. Changing anything here
# changes the agent's shape and goes through an infra PR; the image ships on
# its own.
[deploy]
runtime = "cloud_run_job"
cpu = "6"
memory = "24Gi"
timeout_seconds = 7200
