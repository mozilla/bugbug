[project]
name = "hackbot-agent-test-repair-fix"
version = "0.1.0"
description = "Cloud Run Job image that runs the test-repair-fix agent for hackbot-api"
requires-python = ">=3.14"
dependencies = [
    "hackbot-agent-test-repair",
    "hackbot-runtime[claude-sdk,phabricator]",
    "agent-tools[bugzilla,firefox]",
    "claude-agent-sdk>=0.2.165",
]

[tool.uv.sources]
hackbot-agent-test-repair = { workspace = true }
hackbot-runtime = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
