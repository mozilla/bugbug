steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - SENTRY_AUTH_TOKEN
    args:
      - build
      - "--no-cache"
      - "-t"
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - "-f"
      - services/$_SERVICE_NAME/Dockerfile
      - "--secret"
      - id=sentry_auth_token,env=SENTRY_AUTH_TOKEN
      - "--build-arg"
      - SENTRY_DSN=$_SENTRY_DSN
      - "--build-arg"
      - SENTRY_RELEASE=$_SERVICE_NAME@$COMMIT_SHA
  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - "--platform=managed"
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - "--region=$_DEPLOY_REGION"
      - "--quiet"
    entrypoint: gcloud
  - name: getsentry/sentry-cli
    id: Sentry release
    secretEnv:
      - SENTRY_AUTH_TOKEN
    args:
      - releases
      - new
      - $_SERVICE_NAME@$COMMIT_SHA
      - "--finalize"
  - name: getsentry/sentry-cli
    id: Sentry commits
    secretEnv:
      - SENTRY_AUTH_TOKEN
    args:
      - releases
      - set-commits
      - $_SERVICE_NAME@$COMMIT_SHA
      - "--commit"
      - mozilla/bugbug@$COMMIT_SHA
images:
  - >-
    $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: MUST_MATCH
  logging: CLOUD_LOGGING_ONLY
  env:
    - SENTRY_ORG=mozilla
    - SENTRY_PROJECT=$_SERVICE_NAME
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/sentry-auth-token/versions/latest
      env: SENTRY_AUTH_TOKEN
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - $_SERVICE_NAME
