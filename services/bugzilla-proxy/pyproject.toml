[project]
name = "bugzilla-proxy"
version = "0.1.0"
description = "Authorization proxy for the Bugzilla REST API, scoped by per-run capability tokens"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "pyjwt[crypto]>=2.8.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "cryptography>=42.0.0",
    # Not a runtime dependency: the tests use it to pin how an agent's client
    # actually reads this service's error bodies.
    "bugsy>=0.12",
    # bugsy imports six but does not declare it.
    "six>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bugzilla_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
