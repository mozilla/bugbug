services:
  bugzilla-proxy:
    build:
      context: ../..
      dockerfile: services/bugzilla-proxy/Dockerfile
    # Inject config into the container (relative to this compose file = repo root .env).
    env_file: ../../.env
    environment:
      # Both keys arrive via env_file above. Restated here only to fail at
      # compose time rather than on the first upstream call. They must differ:
      # the unprivileged one belongs to an account in no groups.
      BUGZILLA_PRIVILEGED_API_KEY: ${BUGZILLA_PRIVILEGED_API_KEY:?error}
      BUGZILLA_UNPRIVILEGED_API_KEY: ${BUGZILLA_UNPRIVILEGED_API_KEY:?error}
      # The public half of the keypair hackbot-api signs with locally. Generate
      # one with the commands in this service's README and put both halves in
      # the root .env, as JWT_PUBLIC_KEY and BZ_TOKEN_PRIVATE_KEY.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?generate a dev keypair first}
    # Live-edit the source without rebuilding (cwd takes precedence on sys.path).
    volumes:
      - ./bugzilla_proxy:/app/bugzilla_proxy
    ports:
      - "8766:8080"
    command: python -m bugzilla_proxy.main
