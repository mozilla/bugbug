[project]
name = "hackbot-runtime"
version = "0.1.0"
description = "Agent-side runtime for hackbot-api: signed-policy upload, summary contract, exception handling"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "pydantic-settings>=2.1.0",
    # Action declarations use the shared @tool decorator/registry from agent-tools
    # (base is framework-neutral: pydantic only).
    "agent-tools",
]

[project.optional-dependencies]
# claude-agent-sdk building blocks: the streamed-message Reporter
# (hackbot_runtime.claude) and the actions MCP adapter
# (hackbot_runtime.actions.claude_sdk, which builds via agent-tools' adapter).
# Not needed by consumers that only read the summary contract.
claude-sdk = ["claude-agent-sdk>=0.1.30", "agent-tools[claude-sdk]"]

[tool.uv.sources]
agent-tools = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
