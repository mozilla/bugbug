[project]
name = "bugzilla-broker"
version = "0.1.0"
description = "Sidecar that holds the Bugzilla key and serves the read tools over MCP, optionally public content only"
requires-python = ">=3.14"
dependencies = [
    "agent-tools[bugzilla,claude-sdk]",
    "bugsy",
    "mcp>=1.0.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.uv.sources]
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bugzilla_broker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
