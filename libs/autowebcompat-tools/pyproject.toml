[project]
name = "autowebcompat-tools"
version = "0.1.0"
description = "Code shared by the autowebcompat agents"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "hackbot-runtime[claude-sdk]",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.uv.sources]
hackbot-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autowebcompat_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]